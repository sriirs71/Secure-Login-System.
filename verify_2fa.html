{% extends 'base.html' %}
{% block title %}Verify 2FA - Secure Login{% endblock %}
{% block content %}
<div class="card glass-effect">
    <div class="card-header">
        <h1>Two-Step Verification</h1>
        <p>Enter the authentication code from your app</p>
    </div>
    
    <form action="{{ url_for('verify_2fa') }}" method="POST" class="form">
        <div class="form-group">
            <label for="token">Authentication Code</label>
            <input type="text" id="token" name="token" required pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="123456" autofocus>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Verify</button>
    </form>
    
    <div class="card-footer">
        <a href="{{ url_for('login') }}" class="link">Back to Login</a>
    </div>
</div>
{% endblock %}
