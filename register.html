{% extends 'base.html' %}
{% block title %}Register - Secure Login{% endblock %}
{% block content %}
<div class="card glass-effect">
    <div class="card-header">
        <h1>Create Account</h1>
        <p>Join us today and secure your data</p>
    </div>
    
    <form action="{{ url_for('register') }}" method="POST" class="form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="Choose a username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Create a strong password">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    
    <div class="card-footer">
        <p>Already have an account? <a href="{{ url_for('login') }}" class="link">Sign in</a></p>
    </div>
</div>
{% endblock %}
