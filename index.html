{% extends 'base.html' %}
{% block title %}Dashboard - Secure Login{% endblock %}
{% block content %}
<div class="card glass-effect">
    <div class="card-header">
        <h1>Welcome, <span class="highlight">{{ username }}</span></h1>
        <p>You have successfully logged in.</p>
    </div>
    
    <div class="card-body text-center">
        <div class="action-buttons">
            <a href="{{ url_for('setup_2fa') }}" class="btn btn-secondary">Setup 2FA</a>
            <form action="{{ url_for('logout') }}" method="POST" class="inline-form">
                <button type="submit" class="btn btn-primary">Logout</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
