{% extends 'base.html' %}
{% block title %}Login - Secure Login{% endblock %}
{% block content %}
<div class="card glass-effect">
    <div class="card-header">
        <h1>Welcome Back</h1>
        <p>Enter your credentials to access your account</p>
    </div>
    
    <form action="{{ url_for('login') }}" method="POST" class="form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="johndoe">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    
    <div class="card-footer">
        <p>Don't have an account? <a href="{{ url_for('register') }}" class="link">Create one</a></p>
    </div>
</div>
{% endblock %}
